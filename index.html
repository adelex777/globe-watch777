<title>Globe Watch – ลูกโลกเฝ้าระวัง</title>
<style>
:root{color-scheme:dark;--bg:#04081a;--pn:#0f1730;--ln:#243053;--tx:#e8ecf6;--mu:#93a0bd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:"Noto Sans Thai",system-ui,sans-serif}
#app{display:flex;height:100%}
#stage{flex:1;position:relative;min-width:0;background:radial-gradient(ellipse at 50% 40%,#0b1636,#02040d 70%)}
#cv{display:block;cursor:grab;touch-action:none}
#ctl{position:absolute;right:12px;bottom:12px;display:flex;gap:6px}
#ctl button{margin:0;width:38px;height:38px;padding:0;font-size:18px}
#side{width:380px;max-width:100%;background:var(--pn);border-left:1px solid var(--ln);padding:16px;overflow-y:auto}
h1{font-size:18px;margin:0 0 4px}
.mu{color:var(--mu);font-size:12px;line-height:1.5}
.lg{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0;font-size:12px}
.lg span{display:flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.card{border:1px solid var(--ln);border-radius:10px;padding:12px;margin-top:12px}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;color:#000;font-weight:600}
.row{margin-top:12px;font-size:14px;line-height:1.6}
.row b{display:block;font-size:12px;color:var(--mu);font-weight:500;margin-bottom:2px}
.big{font-size:20px;font-weight:600}
.lk{color:#8fb4ff}
button{background:#1d2a4d;color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer}
button:hover{background:#26366a}
.bdg{background:#ef4444;color:#fff;border-radius:99px;padding:0 6px;font-size:11px;margin-left:4px}
#banner{display:none;position:absolute;left:12px;right:12px;top:12px;background:#7f1d1d;border:1px solid #ef4444;border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer;z-index:2}
#feed{border:1px solid var(--ln);border-radius:10px;padding:8px 12px;margin-top:12px;max-height:46vh;overflow-y:auto}
.fi{border-top:1px solid var(--ln);padding:8px 0;font-size:13px;line-height:1.5}.fi.c{cursor:pointer}.fi.u{color:#fecaca}.fd{font-size:12px;color:var(--mu);margin-top:8px}
.ev{margin-top:8px;padding:6px 10px;background:#0b1226;border-radius:6px;font-size:13px;line-height:1.5}
.tabs{display:flex;gap:6px;margin-top:12px}
.tabs button{flex:1;padding:7px 4px}
.tabs button.on{background:#2b3f7a;border-color:#5a78d6}
#list{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
#list i{font-style:normal;font-size:12px;border:1px solid var(--ln);border-radius:99px;padding:3px 9px;cursor:pointer}
@media(max-width:760px){#app{flex-direction:column}#stage{flex:none;height:56%}#side{width:100%;border-left:0;border-top:1px solid var(--ln);flex:1}}
</style>
</head>

<div id="app">

const cv=document.getElementById("cv"),ctx=cv.getContext("2d"),info=document.getElementById("info");
const proj=d3.geoOrthographic().clipAngle(90),path=d3.geoPath(proj,ctx),grat=d3.geoGraticule10(),SPH={type:"Sphere"};
let L=[],cur="",D=[],DS=[],sel=null,G={},F=[],rot=[-100,-18],zoom=1,auto=true,W=0,H=0,dpr=1,tab=0,selF=null,sx=0,sy=0,moved=0;
const stars=Array.from({length:170},()=>[Math.random(),Math.random(),Math.random()*1.3+.2,Math.random()*.6+.25]);
// ชื่อประเทศภาษาไทยสำหรับประเทศที่ไม่มีในระบบ: ใช้ Intl ของเบราว์เซอร์
const thMap={};
try{const en=new Intl.DisplayNames(["en"],{type:"region"}),th=new Intl.DisplayNames(["th"],{type:"region"});
 for(let a=65;a<91;a++)for(let b=65;b<91;b++){const c=String.fromCharCode(a,b);try{const e=en.of(c),t=th.of(c);if(e&&t&&e!==c&&t!==c)thMap[e]=t}catch(_){}}}catch(_){}
const ALT={"Dem. Rep. Congo":"Congo - Kinshasa","Congo":"Congo - Brazzaville","Central African Rep.":"Central African Republic","Dominican Rep.":"Dominican Republic","Eq. Guinea":"Equatorial Guinea","Bosnia and Herz.":"Bosnia & Herzegovina","S. Sudan":"South Sudan","Côte d'Ivoire":"Côte d’Ivoire","W. Sahara":"Western Sahara","Solomon Is.":"Solomon Islands","Falkland Is.":"Falkland Islands","United States of America":"United States","Myanmar":"Myanmar (Burma)","Turkey":"Türkiye","eSwatini":"Eswatini","Palestine":"Palestinian Territories"};
const AL={"United States":"United States of America","Türkiye":"Turkey"};
const thName=f=>f.d?f.d.th:(thMap[ALT[f.name]||f.name]||thMap[f.name]||f.name||"");
// ตัวถอดรหัส TopoJSON ขนาดเล็ก (ไม่ต้องพึ่งไลบรารีเพิ่ม)
function topo(t,o){const[sx,sy]=t.transform.scale,[tx,ty]=t.transform.translate;
 const arcs=t.arcs.map(a=>{let x=0,y=0;return a.map(p=>{x+=p[0];y+=p[1];return[x*sx+tx,y*sy+ty]})});
 const arc=i=>i<0?arcs[~i].slice().reverse():arcs[i];
 const ring=r=>r.reduce((o,i)=>o.concat(o.length?arc(i).slice(1):arc(i)),[]),poly=p=>p.map(ring);
 return o.geometries.filter(g=>g.type==="Polygon"||g.type==="MultiPolygon").map(g=>({type:"Feature",id:g.id,name:(g.properties||{}).name,
  geometry:g.type==="Polygon"?{type:"Polygon",coordinates:poly(g.arcs)}:{type:"MultiPolygon",coordinates:g.arcs.map(poly)}}))}
function link(){DS=D.slice().sort((a,b)=>a.level-b.level);const m={};D.forEach(d=>m[AL[d.en]||d.en]=d);F.forEach(f=>{f.d=m[f.name]||null})}
function fit(){proj.translate([W/2,H/2]).scale(Math.min(W,H)/2*.86*zoom)}
function size(){const b=cv.parentElement.getBoundingClientRect();W=b.width;H=b.height;dpr=window.devicePixelRatio||1;cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+"px";cv.style.height=H+"px";fit()}
let placed=[];
function label(ll,text,c0,a,bold){if(d3.geoDistance(c0,ll)>1.3)return;const p=proj(ll);
 ctx.font=(bold?"600 ":"")+'12px "Noto Sans Thai",system-ui,sans-serif';const w=ctx.measureText(text).width,bx=[p[0]-w/2-2,p[1]-23,p[0]+w/2+2,p[1]-6];
 if(placed.some(q=>bx[0]<q[2]&&bx[2]>q[0]&&bx[1]<q[3]&&bx[3]>q[1]))return;placed.push(bx);ctx.lineWidth=3;ctx.strokeStyle="rgba(4,10,28,.9)";ctx.strokeText(text,p[0],p[1]-9);ctx.fillStyle=`rgba(238,244,255,${a})`;ctx.fillText(text,p[0],p[1]-9)}
function draw(t){
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
 for(const s of stars){ctx.fillStyle=`rgba(255,255,255,${s[3]})`;ctx.fillRect(s[0]*W,s[1]*H,s[2],s[2])}
 proj.rotate(rot);const R=proj.scale(),[cx,cy]=proj.translate();
 let g=ctx.createRadialGradient(cx,cy,R*.97,cx,cy,R*1.22);g.addColorStop(0,"rgba(120,180,255,.65)");g.addColorStop(1,"rgba(120,180,255,0)");
 ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R*1.22,0,7);ctx.fill();
 g=ctx.createRadialGradient(cx-R*.35,cy-R*.4,R*.05,cx,cy,R);g.addColorStop(0,"#3f8bd0");g.addColorStop(.6,"#164783");g.addColorStop(1,"#071a3f");
 ctx.fillStyle=g;ctx.beginPath();path(SPH);ctx.fill();
 ctx.beginPath();path(grat);ctx.strokeStyle="rgba(255,255,255,.07)";ctx.lineWidth=.5;ctx.stroke();
 const pulse=.55+.2*Math.sin(t/260);
 for(const f of F){ctx.beginPath();path(f);ctx.fillStyle="#4d6e50";ctx.fill();if(f.d){ctx.fillStyle=hexA(COL[f.d.level],f.d.level==1?pulse:.55);ctx.fill()}
  ctx.strokeStyle=f===selF?"#fff":"rgba(235,245,235,.35)";ctx.lineWidth=f===selF?1.8:.5;ctx.stroke()}
 g=ctx.createRadialGradient(cx-R*.42,cy-R*.46,R*.1,cx,cy,R*1.02);g.addColorStop(0,"rgba(255,255,255,.14)");g.addColorStop(.45,"rgba(255,255,255,0)");g.addColorStop(1,"rgba(0,5,25,.62)");
 ctx.fillStyle=g;ctx.beginPath();path(SPH);ctx.fill();
 ctx.textAlign="center";ctx.lineJoin="round";const c0=[-rot[0],-rot[1]];placed=[];
 for(const d of D)if(d===sel)label([d.lon,d.lat],d.th,c0,1,true);
 for(const d of DS)if(d!==sel)label([d.lon,d.lat],d.th,c0,1,true);
 for(const f of F){if(!f.d&&f.c&&f.a*R*R>2400)label(f.c,thName(f),c0,.7)}
 for(const d of D){const ll=[d.lon,d.lat];if(d3.geoDistance(c0,ll)>1.5)continue;const p=proj(ll);
  if(d.level==1){ctx.beginPath();ctx.arc(p[0],p[1],5+((t/50)%14),0,7);ctx.strokeStyle=`rgba(239,68,68,${1-((t/50)%14)/14})`;ctx.lineWidth=1.5;ctx.stroke()}
  ctx.beginPath();ctx.arc(p[0],p[1],4.5,0,7);ctx.fillStyle=COL[d.level];ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=1.2;ctx.stroke()}
}
function hit(px,py){const[cx,cy]=proj.translate(),c0=[-rot[0],-rot[1]];let best=null,bd=14;
 for(const d of D){if(d3.geoDistance(c0,[d.lon,d.lat])>1.5)continue;const p=proj([d.lon,d.lat]),dd=Math.hypot(p[0]-px,p[1]-py);if(dd<bd){bd=dd;best=d}}
 if(best)return{d:best,f:F.find(f=>f.d===best)||null};
 if(Math.hypot(px-cx,py-cy)>proj.scale())return null;
 const ll=proj.invert([px,py]);if(!ll||isNaN(ll[0]))return null;const f=F.find(f=>d3.geoContains(f,ll));return f?{d:f.d,f}:null}
function pick(h){if(!h)return;auto=false;spin();selF=h.f;const d=h.d;sel=d;
 const c=d?[d.lon,d.lat]:h.f.c,t=d3.interpolate(rot,[-c[0],-c[1]]);d3.transition().duration(900).tween("r",()=>u=>{rot=t(u)});render(d,h.f)}
const ATT={confirmed:"ยืนยันจากหลายแหล่ง",claimed:"ฝ่ายหนึ่งกล่าวอ้าง",unverified:"ยังไม่ยืนยัน"};
const evHtml=d=>(d.events||[]).map(e=>`<div class="ev" style="border-left:3px solid ${COL[e.severity]||COL[3]}"><b style="display:inline;color:var(--tx);font-size:13px">${esc(e.attacker||"ไม่ทราบฝ่าย")} → ${esc(e.target||"ไม่ระบุเป้าหมาย")}</b><br><span class="mu">อาวุธ:</span> ${esc(e.weapon||"ไม่ระบุ")} · <span class="mu">พื้นที่:</span> ${esc(e.where||"ไม่ระบุ")}${e.impact?`<br><span class="mu">ผลกระทบ:</span> ${esc(e.impact)}`:""}<br><span class="mu">การระบุฝ่าย: ${ATT[e.attribution]||ATT.unverified}</span></div>`).join("");
const row=(t,h)=>`<div class="row"><b>${t}</b>${h}</div>`;
const qh=(m,lab,col)=>m?`<span class="big">${Number(m.last).toLocaleString()}</span> <span style="font-weight:600;${col?`color:${m.chg>=0?"#4ade80":"#f87171"}`:""}">${m.chg>=0?"▲ +":"▼ "}${m.chg}%</span> <span class="mu">${esc(lab)} (ปิด ${esc(m.asof)})</span><br>`:"";
function render(d,f){
 if(!d){info.innerHTML=`<div class="card"><div style="font-size:17px;font-weight:600">${esc(thName(f))}</div><div class="mu" style="margin-top:8px">ยังไม่มีประเทศนี้ในระบบ เพิ่มได้ที่ scripts/countries.json</div></div>`;return}
 const T=["📰 ข่าว","💰 การเงิน","⚠️ ความเสี่ยง"];let body="";
 if(tab==0)body=(d.story?`<div class="row" style="white-space:pre-line"><b>เกิดอะไรขึ้น</b>${esc(d.story)}</div>`:row("เกิดอะไรขึ้น","ยังไม่มีบทความ รอระบบอัปเดตรอบถัดไป"))+
  ((d.sources||[]).filter(s=>/^https?:/.test(s.url)).slice(0,6).map(s=>`<div class="mu" style="margin-top:6px">🔗 ${lnk(s.url,s.title||s.url)} · ${esc(s.domain||"")}</div>`).join(""))+
  `<div class="mu" style="margin-top:10px">อัปเดต: ${esc(d.updated||"-")}</div>`;
 else if(tab==1)body=row("สรุปการเงิน",esc(d.fin||"-"))+
  row("🏦 ดอกเบี้ยนโยบาย · "+esc(d.cb||"-"),(d.rate_val?`<span class="big">${esc(d.rate_val)}</span> `:"")+esc(d.rate_note||d.rate||"-")+" "+lnk(d.rate_src,"แหล่งที่มา"))+
  row("📈 ตลาดหุ้น"+(d.idx?" · "+esc(d.idx):""),qh(d.mkt_data,"",true)+esc(d.mkt||"-"))+
  row("💱 ค่าเงิน · เงินเฟ้อ",qh(d.fx_data,d.fxlabel||"",false)+esc(d.fxnote||"-")+(d.infl_val?`<br><span class="mu">เงินเฟ้อ:</span> <span class="big" style="font-size:17px">${esc(d.infl_val)}</span> ${esc(d.infl_note||"")} ${lnk(d.infl_src,"แหล่งที่มา")}`:""))+
  row("⛽ พลังงาน · ราคาน้ำมัน",(G.brent?qh(G.brent,"Brent โลก (USD)",true):"")+esc(d.energy||"-"));
 else body=row("⚔️ สงคราม/ความมั่นคง",esc(d.war||"-")+evHtml(d))+row("🏛️ การปกครอง",esc(d.gov||"-"))+row("🛡️ ไซเบอร์ · ธนาคาร/ระบบชำระเงิน/ระบบรัฐ",esc(d.cyber||"-"))+row("🌪️ ภัยพิบัติธรรมชาติ",esc(d.disaster||"-"))+
  `<div class="mu" style="margin-top:12px">เกณฑ์ระดับสี: ประเมินจากความรุนแรงของผลกระทบต่อประชาชนส่วนใหญ่</div>`;
 info.innerHTML=`<div class="card"><div style="font-size:17px;font-weight:600">${esc(d.th)} <span class="mu">${esc(d.en)}</span></div>
 <span class="badge" style="background:${COL[d.level]};margin-top:6px">${LAB[d.level]}</span>${d.reason?`<div class="mu" style="margin-top:8px">เหตุผลของสีนี้: ${esc(d.reason)}</div>`:""}
 <div class="tabs">${T.map((t,i)=>`<button class="${i==tab?"on":""}">${t}</button>`).join("")}</div>${body}</div>`;
 info.querySelectorAll(".tabs button").forEach((b,i)=>b.onclick=()=>{tab=i;render(d,f)})}
function chips(){d3.select("#list").selectAll("i").data(D.slice().sort((a,b)=>a.level-b.level||a.th.localeCompare(b.th,"th"))).join("i").style("border-color",d=>COL[d.level]).text(d=>d.th).on("click",(e,d)=>pick({d,f:F.find(f=>f.d===d)||null}))}
const fT=t=>new Date(t).toLocaleTimeString("th-TH",{timeZone:"Asia/Bangkok",hour:"2-digit",minute:"2-digit"});
const fD=t=>new Date(t).toLocaleDateString("th-TH",{timeZone:"Asia/Bangkok",day:"numeric",month:"short"});
const runName=e=>{if(e.run==="watch")return"เฝ้าระวังฉุกเฉิน";const h=+new Date(e.t).toLocaleString("en-GB",{timeZone:"Asia/Bangkok",hour:"2-digit",hour12:false});return h<10?"รอบเช้า":h<15?"รอบกลางวัน":"รอบเย็น"};
const seenGet=()=>{try{return localStorage.getItem("gwSeen")||""}catch(e){return""}},seenSet=v=>{try{localStorage.setItem("gwSeen",v)}catch(e){}};
const feedEl=document.getElementById("feed"),badge=document.getElementById("badge"),banner=document.getElementById("banner");
function feed(){const seen=seenGet(),n=L.filter(e=>e.type!=="run"&&e.t>seen).length;badge.textContent=n?" "+n:"";badge.className=n?"bdg":"";
 let day="",h="";if(!L.length)h='<div class="mu">ยังไม่มีบันทึกการอัปเดต</div>';
 for(const e of L){const d=fD(e.t);if(d!==day){day=d;h+=`<div class="fd">${esc(d)}</div>`}
  if(e.type==="run")h+=`<div class="fi">🕒 <b>${fT(e.t)}</b> ${runName(e)} ${e.applied===0?(e.run==="watch"?"ไม่พบข่าวพุ่ง":"❌ อัปเดตไม่สำเร็จ"):"เสร็จสิ้น"} · ตรวจ ${e.checked} ประเทศ${e.applied!=null?" · สรุปใหม่สำเร็จ "+e.applied:""} · เปลี่ยนแปลงสำคัญ ${e.updated} ประเทศ · มีข่าวใหม่ ${e.news} ประเทศ${e.errors?`<br>⚠️ ผิดพลาด ${e.errors} ประเทศ: ${esc(e.err0||"")}`:""}${e.gdelt_fail?`<br>⚠️ ดึงข่าว GDELT ไม่สำเร็จ ${e.gdelt_fail} ครั้ง`:""}</div>`;
  else h+=`<div class="fi c ${e.urgent?"u":""}" data-c="${esc(e.en)}">${e.urgent?"🚨":"•"} <b>${esc(e.country)}</b> · ${fT(e.t)} ${runName(e)}<br>${(e.changes||[]).map(esc).join("<br>")}</div>`}
 feedEl.innerHTML=h;feedEl.querySelectorAll(".fi.c").forEach(el=>el.onclick=()=>{const d=D.find(x=>x.en===el.dataset.c);if(d)pick({d,f:F.find(f=>f.d===d)||null})})}
function urgentNote(es){if(!es.length)return;const e=es[0];banner.textContent="🚨 "+e.country+" · "+e.changes[0]+" · "+fT(e.t)+(es.length>1?" (และอีก "+(es.length-1)+" ประเทศ)":"");banner.style.display="block";
 if(window.Notification&&Notification.permission==="granted")es.forEach(x=>new Notification("🚨 "+x.country,{body:(x.changes||[]).join(" · ")}))}
banner.onclick=()=>{banner.style.display="none"};
document.getElementById("bell").onclick=()=>{const o=feedEl.style.display==="none";feedEl.style.display=o?"block":"none";if(o&&L[0]){seenSet(L[0].t);feed()}};
document.getElementById("ntf").onclick=()=>{if(window.Notification)Notification.requestPermission().then(r=>{document.getElementById("ntf").textContent=r==="granted"?"แจ้งเตือนบนเบราว์เซอร์: เปิดแล้ว":"แจ้งเตือนบนเบราว์เซอร์: ถูกปิดไว้"})};
async function refresh(){const j=await getJSON(["data/data.json"]);if(j&&j.generated!==cur)load(j);
 const l=await getJSON(["data/log.json"]);if(Array.isArray(l)){const known=new Set(L.map(e=>e.t+e.country));const fresh=l.filter(e=>e.urgent&&!known.has(e.t+e.country));L=l;feed();urgentNote(fresh)}}
function spin(){document.getElementById("spin").textContent=auto?"⏸":"▶"}
d3.select(cv).call(d3.drag().on("start",e=>{[sx,sy]=d3.pointer(e.sourceEvent,cv);moved=0;auto=false;spin()})
 .on("drag",e=>{moved+=Math.abs(e.dx)+Math.abs(e.dy);const k=.3/Math.pow(zoom,.7);rot=[rot[0]+e.dx*k,Math.max(-85,Math.min(85,rot[1]-e.dy*k))]})
 .on("end",()=>{if(moved<5)pick(hit(sx,sy))}));
cv.addEventListener("wheel",e=>{e.preventDefault();zoom=Math.max(.8,Math.min(5,zoom*(e.deltaY<0?1.12:.89)));fit()},{passive:false});
document.getElementById("zi").onclick=()=>{zoom=Math.min(5,zoom*1.3);fit()};
document.getElementById("zo").onclick=()=>{zoom=Math.max(.8,zoom/1.3);fit()};
document.getElementById("spin").onclick=()=>{auto=!auto;spin()};
addEventListener("resize",size);size();
d3.timer(t=>{if(auto)rot[0]+=.07;draw(t)});
function load(j,note){G=j.global||{};D=j.countries;cur=j.generated;link();chips();if(sel){const d=D.find(x=>x.en===sel.en);if(d){sel=d;render(d,selF)}}
 document.getElementById("stamp").textContent=note||(!j.last_ok?"⚠ ยังเป็นข้อมูลตัวอย่าง ยังไม่เคยมีรอบอัปเดตสำเร็จ"+(j.last_fail?" (รอบล่าสุดล้มเหลว)":"")+" · ตรวจแท็บ Actions ของ GitHub หรือรัน workflow ชื่อ selftest":"เนื้อหาอัปเดตล่าสุด "+new Date(j.last_ok||j.generated).toLocaleString("th-TH",{timeZone:"Asia/Bangkok"})+" · รอบล่าสุด: "+j.run+(j.last_fail&&(!j.last_ok||j.last_fail>j.last_ok)?" ⚠ รอบล่าสุดอัปเดตไม่สำเร็จ":""))}
async function getJSON(us){for(const u of us){try{const r=await fetch(u,{cache:"no-store"});if(r.ok)return await r.json()}catch(e){}}return null}
(async()=>{
 const j=await getJSON(["data/data.json"]);
 try{if(j)load(j);else load(JSON.parse(document.getElementById("seed").textContent),"⚠ เปิดจากไฟล์ในเครื่อง จึงแสดงข้อมูลตัวอย่าง ต้องเปิดผ่านเว็บ (เช่น GitHub Pages) เพื่อดูข้อมูลล่าสุด")}catch(e){document.getElementById("stamp").textContent="โหลดข้อมูลไม่สำเร็จ"}
 const t=await getJSON(["world.json","https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json"]);
 if(t){try{F=topo(t,t.objects.countries);F.forEach(f=>{f.c=d3.geoCentroid(f);f.a=d3.geoArea(f)});link()}catch(e){console.error(e)}}
 else document.getElementById("stamp").textContent+=" · ไม่พบแผนที่ประเทศ แสดงเฉพาะจุด (วางไฟล์ world.json ไว้ข้าง index.html ได้)";
 const l=await getJSON(["data/log.json"]);L=Array.isArray(l)?l:[];feed();
 const seen=seenGet(),day=Date.now()-864e5;urgentNote(L.filter(e=>e.urgent&&e.t>seen&&new Date(e.t)>day));
 setInterval(refresh,300000);
})();
